spring.application.name=saad-birthday

# Railway (and most hosts) give the port in the PORT environment variable
server.port=${PORT:8080}

# Smaller, faster downloads for HTML/CSS/JS
server.compression.enabled=true
server.compression.min-response-size=1024

# ---- Edit these to customize the site (or set them as Railway Variables) ----
# Railway Variables: BIRTHDAY_NAME, BIRTHDAY_FROM, BIRTHDAY_AGE, BIRTHDAY_DATE
birthday.name=Saad
birthday.from=Abir
# Leave age empty to hide it, e.g. birthday.age=18
birthday.age=
# Format: yyyy-MM-dd (used for the countdown)
birthday.date=2026-10-21
